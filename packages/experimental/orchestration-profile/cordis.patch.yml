# Apply after dsh-base. Normal subagent tools use this pool in Orchestration mode.
- insert:
    - id: orchestration
      name: '@deepseek-ai/dsh-orchestration'
      config:
        pool:
          - provider: uni-paderborn
            model: gwdg.deepseek-v4-flash-0731
          - provider: uni-paderborn
            model: gwdg.glm-5.3-flash
          - provider: uni-paderborn
            model: hs-de.qwen3.8-27b
          - provider: uni-paderborn
            model: gwdg.gemma-4-31b-it
          - provider: uni-paderborn
            model: hs-de.openai-gpt-oss-120b

    - id: ui-orchestration
      name: '@deepseek-ai/dsh-client-ui-orchestration'
