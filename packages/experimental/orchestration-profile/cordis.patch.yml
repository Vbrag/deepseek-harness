# Experimental Orchestration Mode profile layer. Apply after dsh-base.
# Orchestration coexists with normal delegation, so no default tools are
# disabled; this layer only mounts the orchestration service and its model tool.
# The service mounts with no pool: the picker defaults to every catalog model
# selected, and the user's Save writes the pool to the profile as a plain
# user-layer value, so it persists across restart.

- insert:
    - id: orchestration
      name: '@deepseek-ai/dsh-experimental-orchestration'

    - id: tool-orchestration
      name: '@deepseek-ai/dsh-experimental-tool-orchestration'

    - id: ui-orchestration
      name: '@deepseek-ai/dsh-experimental-client-ui-orchestration'
