# Apply after dsh-base. Normal subagent tools use this pool in Orchestration mode.
- id: compaction-basic
  config:
    modelPolicies: &compaction-budgets
      - provider: uni-paderborn
        model: gwdg.glm-5.3-flash
        headroomTokens: 8192
        maxTokens: 8192
      - provider: uni-paderborn
        model: hs-de.qwen3.8-27b
        headroomTokens: 8192
        maxTokens: 8192

- insert:
    - id: orchestration-compaction-defaults
      name: '@deepseek-ai/dsh-orchestration-profile'
      config:
        modelPolicies: *compaction-budgets

    - id: orchestration
      name: '@deepseek-ai/dsh-orchestration'
      config:
        # The default pool is the full gateway chat set; cursor over
        # UPB_CHAT_ROUTE_MODELS in @deepseek-ai/dsh-llm-pi-ai.
        pool:
          - provider: uni-paderborn
            model: hs-de.latest-basemodel
          - provider: uni-paderborn
            model: anthropic.latest-basemodel
          - provider: uni-paderborn
            model: anthropic.claude-fable-5-2
          - provider: uni-paderborn
            model: anthropic.claude-opus-5-5
          - provider: uni-paderborn
            model: anthropic.claude-sonnet-5-5
          - provider: uni-paderborn
            model: anthropic.claude-haiku-5-5
          - provider: uni-paderborn
            model: gwdg.deepseek-v4.1-flash-1017
          - provider: uni-paderborn
            model: gwdg.glm-5.3
          - provider: uni-paderborn
            model: gwdg.mistral-large-4-1t-a52b
          - provider: uni-paderborn
            model: gwdg.gemma-4-31b-it
          - provider: uni-paderborn
            model: gwdg.deepseek-v4-flash-0731
          - provider: uni-paderborn
            model: hs-de.openai-gpt-oss-120b
          - provider: uni-paderborn
            model: gwdg.glm-5.3-flash
          - provider: uni-paderborn
