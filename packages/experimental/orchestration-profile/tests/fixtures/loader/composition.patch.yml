- insert:
    - id: orchestration-mock-llm
      name: './orchestration-mock-llm.ts'
    - id: orchestration
      name: '@deepseek-ai/dsh-orchestration'
      config:
        pool:
          - { provider: orchestration-mock, model: gwdg.glm-5.3-flash }
          - { provider: orchestration-mock, model: gwdg.gemma-4-31b-it }
          - { provider: orchestration-mock, model: gwdg.qwen3.5-397b-a17b }
        routeCapabilities:
          - { provider: orchestration-mock, model: gwdg.glm-5.3-flash, capabilities: [coding] }
          - { provider: orchestration-mock, model: gwdg.gemma-4-31b-it, capabilities: [vision] }
          - { provider: orchestration-mock, model: gwdg.qwen3.5-397b-a17b, capabilities: [coding, vision] }
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
