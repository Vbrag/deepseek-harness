# Real-provider task with the shipped headless composition and ordinary tools.
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: sandbox-policy
  inject: []
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: low
    models:
      - id: deepseek-v4-flash
        contextWindow: 128000
        maxTokens: 8192
- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
- insert:
    - id: orchestration
      name: '@deepseek-ai/dsh-orchestration'
      config:
        defaultToOrchestrator: true
        pool:
          - { provider: deepseek-official, model: deepseek-v4-flash }
        routeCapabilities:
          - provider: deepseek-official
            model: deepseek-v4-flash
            capabilities: [coding, reasoning, allrounder]
