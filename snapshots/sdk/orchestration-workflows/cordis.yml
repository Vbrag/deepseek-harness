# Exercise assessed workflow fan-out and fresh Ralph rounds through the SDK profile.
- id: skill-filesystem
  config:
    includeDefaultRoots: false
- id: llm-deepseek
  disabled: true
- id: tool-skill
  disabled: true
- id: time-context
  disabled: true
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- insert:
    - id: orchestration
      name: '../../../packages/experimental/dsh-orchestration/lib/index.js'
      config:
        pool:
          - provider: uni-paderborn
            model: gwdg.deepseek-v4-flash-0731
          - provider: uni-paderborn
            model: gwdg.glm-5.3-flash
          - provider: uni-paderborn
            model: hs-de.qwen3.8-27b
          - provider: uni-paderborn
            model: gwdg.gemma-4-31b-it
          - provider: uni-paderborn
            model: hs-de.openai-gpt-oss-120b
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
    - id: orchestration-workflow-fixture
      name: './routing-fixture.ts'
